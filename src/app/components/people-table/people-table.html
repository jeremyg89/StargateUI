<table mat-table [dataSource]="people()">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let person">
      <a [routerLink]="['/astronaut-duties']" [queryParams]="{ name: person.name }">{{
        person.name | capitalCase
      }}</a>
    </td>
  </ng-container>

  <ng-container matColumnDef="currentRank">
    <th mat-header-cell *matHeaderCellDef>Rank</th>
    <td mat-cell *matCellDef="let person">{{ person.currentRank }}</td>
  </ng-container>

  <ng-container matColumnDef="currentDutyTitle">
    <th mat-header-cell *matHeaderCellDef>Duty</th>
    <td mat-cell *matCellDef="let person">{{ person.currentDutyTitle }}</td>
  </ng-container>

  <ng-container matColumnDef="careerStartDate">
    <th mat-header-cell *matHeaderCellDef>Career start</th>
    <td mat-cell *matCellDef="let person">{{ person.careerStartDate | date: 'mediumDate' }}</td>
  </ng-container>

  <ng-container matColumnDef="careerEndDate">
    <th mat-header-cell *matHeaderCellDef>Career end</th>
    <td mat-cell *matCellDef="let person">{{ person.careerEndDate | date: 'mediumDate' }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef class="actions-cell"></th>
    <td mat-cell *matCellDef="let person" class="actions-cell">
      <button mat-button type="button" (click)="editPerson.emit(person)">
        <mat-icon>edit</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
